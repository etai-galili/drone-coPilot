<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>DJI Avata — Drone Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#080C10;--surface:#0D1117;--card:#161B22;
    --border:#30363D;--green:#00FF94;--blue:#4a9eff;
    --cyan:#00ffcc;--orange:#ff9500;--purple:#b464ff;
    --text:#E6EDF3;--muted:#8B949E;--dim:#484F58;
    --font-mono:'JetBrains Mono',monospace;--font-ui:'Inter',sans-serif;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);overflow:hidden}

  /* ── Header ── */
  #header{
    padding:12px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);flex-shrink:0;
  }
  #header h1{font-family:var(--font-mono);font-size:14px;color:var(--green);letter-spacing:.12em}
  #header span{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);display:inline-block;margin-left:6px}

  /* ── Layout ── */
  #app{display:flex;flex-direction:column;height:100vh}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

  /* ── SVG viewport ── */
  #svg-wrap{
    flex:1;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#0d1929 0%,#080C10 100%);
    touch-action:none;
  }
  #drone-svg{
    transition:transform .45s cubic-bezier(.4,0,.2,1);
    transform-origin:center center;
    max-width:100%;max-height:100%;
  }

  /* hint */
  #hint{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    font-family:var(--font-mono);font-size:9px;color:var(--dim);
    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
    pointer-events:none;background:rgba(8,12,16,.7);padding:4px 10px;border-radius:20px;
  }

  /* reset btn */
  #btn-reset{
    position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
    background:transparent;border:1px solid var(--border);color:var(--muted);
    font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;padding:6px 16px;border-radius:20px;cursor:pointer;
    transition:all .15s;display:none;
  }
  #btn-reset.visible{display:block}
  #btn-reset:active{border-color:var(--green);color:var(--green)}

  /* ── Info panel (slides up from bottom) ── */
  #info-panel{
    background:var(--surface);border-top:1px solid var(--border);
    max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);
    flex-shrink:0;
  }
  #info-panel.open{max-height:52vh}
  #info-inner{padding:14px 16px 24px;overflow-y:auto;max-height:52vh}
  #info-inner::-webkit-scrollbar{display:none}

  /* part header */
  #part-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
  #part-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}

  /* spec table */
  table.specs{width:100%;border-collapse:collapse}
  table.specs tr{border-bottom:1px solid var(--card)}
  table.specs td{padding:7px 2px;font-size:12px;line-height:1.4;vertical-align:top}
  table.specs td:first-child{color:var(--muted);width:42%;padding-right:8px;font-family:var(--font-mono);font-size:11px}
  table.specs td:last-child{color:var(--text);font-weight:500}

  /* description */
  #part-desc{font-size:12px;color:var(--muted);line-height:1.65;margin-top:10px;padding-top:10px;border-top:1px solid var(--card)}

  /* ── Parts selector chips ── */
  #chips{
    display:flex;gap:6px;overflow-x:auto;padding:8px 12px;
    border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;
    scrollbar-width:none;
  }
  #chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:11px;
    font-family:var(--font-mono);letter-spacing:.06em;cursor:pointer;
    border:1px solid var(--border);color:var(--muted);background:transparent;
    transition:all .15s;white-space:nowrap;
  }
  .chip:active,.chip.active{color:var(--bg);border-color:transparent}

  /* pulse animation for selected hotspot */
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .hs-ring{transition:opacity .2s}
</style>
</head>

const CHIP_LABELS = {
  camera:'📷 מצלמה', battery:'🔋 סוללה',
  'motor-fl':'⚙️ FL', 'motor-fr':'⚙️ FR',
  'motor-rl':'⚙️ RL', 'motor-rr':'⚙️ RR',
  frame:'🛡️ שלדה', fc:'🖥️ FC/ESC', vtx:'📡 O3+'
};

let active = null;

// Build chips
const chipsEl = document.getElementById('chips');
Object.keys(PARTS).forEach(id => {
  const c = document.createElement('button');
  c.className = 'chip';
  c.textContent = CHIP_LABELS[id] || id;
  c.style.borderColor = PARTS[id].color + '55';
  c.addEventListener('click', () => selectPart(id));
  c.dataset.chip = id;
  chipsEl.appendChild(c);
});

// Touch/click on SVG elements
document.querySelectorAll('[data-part]').forEach(el => {
  el.addEventListener('click', e => {
    e.stopPropagation();
    selectPart(el.dataset.part);
  });
});

function selectPart(id) {
  const part = PARTS[id];
  if (!part) return;
  active = id;

  // Rings
  document.querySelectorAll('.hs-ring').forEach(r => {
    r.style.opacity = '0';
    r.style.animation = 'none';
  });
  const ring = document.getElementById('ring-' + id);
  if (ring) {
    ring.style.opacity = '1';
    ring.style.stroke = part.color;
    ring.style.animation = 'pulse .9s ease-in-out infinite';
  }

  // Zoom
  const wrap = document.getElementById('svg-wrap');
  const svg  = document.getElementById('drone-svg');
  const wW = wrap.clientWidth, wH = wrap.clientHeight;
  const svgW = 500, svgH = 520;
  const displayW = Math.min(wW, wH * svgW / svgH);
  const displayH = displayW * svgH / svgW;
  const scaleBase = displayW / svgW;
  const z = part.zoom;
  const finalScale = scaleBase * z.s;
  const tx = wW/2 - z.x * finalScale;
  const ty = (wH/2) - z.y * finalScale;
  svg.style.transform = `translate(${tx}px,${ty}px) scale(${finalScale})`;

  // Info panel
  document.getElementById('part-name').textContent = part.name;
  const sub = document.getElementById('part-sub');
  sub.textContent = part.sub;
  sub.style.color = part.color;

  const tbl = document.getElementById('spec-tbl');
  tbl.innerHTML = part.specs.map(([k,v]) =>
    `<tr><td>${k}</td><td style="color:${part.color}">${v}</td></tr>`
  ).join('');

  document.getElementById('part-desc').textContent = part.desc;

  document.getElementById('info-panel').classList.add('open');
  document.getElementById('btn-reset').classList.add('visible');
  document.getElementById('hint').style.display = 'none';

  // Chips
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.remove('active');
    c.style.background = 'transparent';
    c.style.color = '';
  });
  const chip = document.querySelector(`[data-chip="${id}"]`);
  if (chip) {
    chip.classList.add('active');
    chip.style.background = part.color;
    chip.style.color = '#080C10';
    chip.style.borderColor = part.color;
    chip.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }
}

function resetView() {
  active = null;
  const svg = document.getElementById('drone-svg');
  svg.style.transform = 'translate(0,0) scale(1)';
  document.querySelectorAll('.hs-ring').forEach(r => {
    r.style.opacity = '0'; r.style.animation = 'none';
  });
  document.getElementById('info-panel').classList.remove('open');
  document.getElementById('btn-reset').classList.remove('visible');
  document.getElementById('hint').style.display = '';
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.remove('active');
    c.style.background = 'transparent';
    c.style.color = '';
  });
}

document.getElementById('btn-reset').addEventListener('click', resetView);

// Tap background to reset
document.getElementById('svg-wrap').addEventListener('click', e => {
  if (e.target === e.currentTarget || e.target.id === 'drone-svg' || e.target.tagName === 'svg') {
    resetView();
  }
});

// Pulse keyframe (inject dynamically since we're in HTML)
const style = document.createElement('style');
style.textContent = '@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}';
document.head.appendChild(style);
</script>
