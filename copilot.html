<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProfWorxML v.1 — OWL EYES 2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0d11;
    --surface:   #0f141a;
    --border:    #283039;
    --green:     #a6ce39;
    --green-dim: #2e3a18;
    --text:      #edf1f3;
    --text-sec:  #93a0a8;
    --red:       #f0524a;
    --amber:     #f0b53a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .logo .brand {
    font-family: system-ui, sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .logo .ver {
    font-family: monospace;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 0.1em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .drone-id {
    font-family: monospace;
    font-size: 0.8rem;
    color: var(--text-sec);
    letter-spacing: 0.08em;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(166,206,57,0.5); }
    50%       { opacity: 0.7; box-shadow: 0 0 0 6px rgba(166,206,57,0); }
  }

  /* CHAT LOG */
  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  #chat-log::-webkit-scrollbar { width: 5px; }
  #chat-log::-webkit-scrollbar-track { background: transparent; }
  #chat-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .bubble-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .bubble-row.user { flex-direction: row-reverse; }

  .avatar {
    font-family: monospace;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 4px 6px;
    border-radius: 6px;
    flex-shrink: 0;
    align-self: flex-start;
  }
  .avatar.ai  { background: var(--green-dim); color: var(--green); }
  .avatar.you { background: #1c232c; color: var(--text-sec); }

  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 20px;
    line-height: 1.55;
    font-size: 0.9rem;
  }
  .bubble.ai {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    color: var(--text);
  }
  .bubble.user {
    background: var(--green-dim);
    border: 1px solid #4a5a24;
    border-bottom-right-radius: 6px;
    color: var(--text);
  }
  .bubble.error {
    background: #1a0808;
    border: 1px solid var(--red);
    color: var(--red);
  }

  /* TYPING INDICATOR */
  .typing-dots {
    display: flex;
    gap: 5px;
    padding: 4px 0;
    align-items: center;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: dot-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%            { transform: translateY(-6px); opacity: 1; }
  }

  /* BOTTOM AREA */
  .bottom {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* QUICK BUTTONS */
  .quick-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .quick-btn {
    font-family: monospace;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sec);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .quick-btn:hover { border-color: var(--green); color: var(--green); }
  .quick-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* INPUT ROW */
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #mic-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sec);
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }
  #mic-btn:hover { border-color: var(--green); color: var(--green); }
  #mic-btn.recording {
    border-color: var(--red);
    color: var(--red);
    animation: mic-pulse 0.8s ease-in-out infinite;
  }
  #mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,74,74,0.5); }
    50%       { box-shadow: 0 0 0 8px rgba(240,74,74,0); }
  }

  #user-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  #user-input::placeholder { color: var(--text-sec); font-family: monospace; font-size: 0.8rem; }
  #user-input:focus { border-color: var(--green-dim); }

  #send-btn {
    width: 40px; height: 40px;
    border-radius: 6px;
    border: none;
    background: var(--green);
    color: #0a0c0f;
    font-size: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    transition: opacity 0.15s;
  }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* VOICE TOGGLE */
  .voice-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .voice-label {
    font-family: monospace;
    font-size: 0.68rem;
    color: var(--text-sec);
    letter-spacing: 0.05em;
  }
  .toggle {
    position: relative;
    width: 36px; height: 20px;
    cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 20px;
    transition: background 0.2s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    left: 3px; top: 3px;
    border-radius: 50%;
    background: var(--text-sec);
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--green-dim); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--green); }

  #voice-na { font-family: monospace; font-size: 0.68rem; color: var(--text-sec); display: none; }

  /* API KEY PROMPT */
  #api-key-modal {
    position: fixed; inset: 0;
    background: rgba(10,12,15,0.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 32px;
    width: min(420px, 90vw);
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-title { font-family: monospace; color: var(--green); font-size: 0.95rem; letter-spacing: 0.05em; }
  .modal-desc { font-size: 0.82rem; color: var(--text-sec); line-height: 1.5; }
  #api-key-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.85rem;
    padding: 9px 12px;
    outline: none;
    font-family: monospace;
  }
  #api-key-input:focus { border-color: var(--green-dim); }
  #api-key-save {
    background: var(--green);
    color: #0a0c0f;
    border: none;
    border-radius: 6px;
    padding: 9px;
    font-weight: 700;
    font-family: monospace;
    font-size: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  #api-key-save:hover { opacity: 0.88; }
  .modal-err { color: var(--red); font-size: 0.78rem; font-family: monospace; display: none; }
</style>
</head>
<body>

<!-- API KEY MODAL -->
<div id="api-key-modal">
  <div class="modal-box">
    <div class="modal-title">// AUTHENTICATION REQUIRED</div>
    <div class="modal-desc">Enter your Anthropic API key to activate ProfWorxML v.1. Key is stored locally in your browser only.</div>
    <input id="api-key-input" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <div class="modal-err" id="modal-err">Invalid key format. Must start with sk-ant-</div>
    <button id="api-key-save">ACTIVATE COPILOT</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo"><span class="brand">ProfWorx</span><span class="ver">ML v.1</span></div>
  <div class="header-right">
    <div class="drone-id">OWL EYES 2 // RECON</div>
    <div class="status-dot"></div>
  </div>
</header>

<!-- CHAT LOG -->
<div id="chat-log">
  <div class="bubble-row">
    <div class="avatar ai">AI</div>
    <div class="bubble ai">ProfWorxML v.1 online. OWL EYES 2 systems ready. What do you need?</div>
  </div>
</div>

<!-- BOTTOM -->
<div class="bottom">
  <div class="quick-btns">
    <button class="quick-btn" data-msg="Give me a full pre-flight checklist for the DJI Avata">PRE-FLIGHT</button>
    <button class="quick-btn" data-msg="What is the DJI Avata battery status, voltage levels, and estimated flight time remaining?">BATTERY</button>
    <button class="quick-btn" data-msg="Best camera settings for 4K recording on DJI Avata in bright outdoor conditions">CAMERA SETUP</button>
    <button class="quick-btn" data-msg="How do I switch between Normal, Sport, and Manual mode on DJI Avata?">FLIGHT MODES</button>
    <button class="quick-btn" data-msg="DJI Avata common issues and how to fix them quickly in the field">TROUBLESHOOT</button>
  </div>
  <div class="input-row">
    <button id="mic-btn" title="Voice input">🎤</button>
    <input id="user-input" type="text" placeholder="ASK PROFWORXML..." autocomplete="off" />
    <button id="send-btn" title="Send">&#9658;</button>
  </div>
  <div class="voice-row">
    <label class="toggle">
      <input type="checkbox" id="voice-toggle" />
      <span class="toggle-slider"></span>
    </label>
    <span class="voice-label">VOICE REPLY</span>
    <span id="voice-na">VOICE N/A</span>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are ProfWorxML v.1, the AI tactical copilot for the DJI Avata drone. You are an expert on all DJI Avata specs, features, and operations. Key facts you know:

SPECS: Max speed 97.2 km/h (S-mode), flight time ~18 min, max transmission range 10 km (O3+), weight 410g, diagonal size 180mm, max wind resistance 10.7 m/s (Level 5).
CAMERA: 1/1.7" CMOS sensor, 4K/60fps, 155° ultra-wide FOV, f/2.8 aperture, integrated ND filters (ND4/8/16/64), RockSteady EIS + HorizonSteady stabilization.
FLIGHT MODES: Manual (Acro), Normal, Sport. Supports DJI Goggles 2 and DJI Motion Controller. Turtle mode for flip-over-after-crash recovery.
BATTERY: Intelligent Flight Battery 2000mAh / 14.76V. Charging via DJI 65W Car Charger or Hub. Low battery auto-return threshold configurable in DJI Fly app.
PROPULSION: 4× brushless motors, 2-blade props, built-in prop guards standard. Replaceable by user.
SENSORS: Downward vision + ToF for hover stabilization. No forward obstacle avoidance — pilot must rely on FPV feed.
CONNECTIVITY: DJI O3+ video transmission, 1080p/100fps low-latency feed to goggles. Remote ID compliant.
COMMON ISSUES & FIXES: GPS weak indoor — switch to ATTI mode. Motor overheating — check for debris in guards. Video glitch — check O3+ interference sources. Battery not charging — inspect pins, reset via DJI Fly. Compass error — recalibrate away from metal structures.
MAINTENANCE: Clean camera lens with microfiber, inspect prop guards after each flight, update firmware via DJI Fly app, store battery at 50–60% if idle over 10 days.

Assist the pilot with diagnostics, flight operations, settings, troubleshooting, and DJI Avata-specific guidance. Be concise, direct, and tactical. Respond in under 4 sentences unless a detailed technical explanation is explicitly needed. Never use filler phrases. Start answers immediately.`;

const LS_KEY_API  = 'profworxml_apikey';
const LS_KEY_VOICE = 'profworxml_voice';

let apiKey = localStorage.getItem(LS_KEY_API) || '';
let busy = false;

// --- API KEY MODAL ---
const modal     = document.getElementById('api-key-modal');
const keyInput  = document.getElementById('api-key-input');
const keySave   = document.getElementById('api-key-save');
const modalErr  = document.getElementById('modal-err');

function showModal() { modal.style.display = 'flex'; }
function hideModal() { modal.style.display = 'none'; }

if (apiKey) hideModal(); else showModal();

keySave.addEventListener('click', () => {
  const val = keyInput.value.trim();
  if (!val.startsWith('sk-ant-') && !val.startsWith('sk-')) {
    modalErr.style.display = 'block';
    return;
  }
  apiKey = val;
  localStorage.setItem(LS_KEY_API, apiKey);
  hideModal();
});
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') keySave.click(); });

// --- VOICE TOGGLE ---
const voiceToggle = document.getElementById('voice-toggle');
const voiceNa     = document.getElementById('voice-na');
voiceToggle.checked = localStorage.getItem(LS_KEY_VOICE) === 'true';
voiceToggle.addEventListener('change', () => {
  localStorage.setItem(LS_KEY_VOICE, voiceToggle.checked);
});

function speak(text) {
  if (!voiceToggle.checked) return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate  = 1.05;
  utt.pitch = 0.88;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Google US English'))
    || voices.find(v => v.name.includes('Daniel'))
    || null;
  if (preferred) utt.voice = preferred;
  window.speechSynthesis.speak(utt);
}

// Load voices async (Chrome)
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
} else {
  voiceToggle.parentElement.parentElement.style.display = 'none';
  voiceNa.style.display = 'inline';
}

// --- CHAT LOG ---
const chatLog = document.getElementById('chat-log');

function appendBubble(role, html) {
  const row = document.createElement('div');
  row.className = `bubble-row${role === 'user' ? ' user' : ''}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'user' ? 'you' : 'ai'}`;
  avatar.textContent = role === 'user' ? 'YOU' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = html;

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return bubble;
}

function appendTyping() {
  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.id = 'typing-row';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ai';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return row;
}

function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

// --- SEND MESSAGE ---
const userInput = document.getElementById('user-input');
const sendBtn   = document.getElementById('send-btn');
const quickBtns = document.querySelectorAll('.quick-btn');
const micBtn    = document.getElementById('mic-btn');

function setDisabled(state) {
  busy = state;
  sendBtn.disabled = state;
  micBtn.disabled  = state;
  quickBtns.forEach(b => b.disabled = state);
}

async function sendMessage(text) {
  text = (text || userInput.value).trim();
  if (!text || busy) return;
  if (!apiKey) { showModal(); return; }

  userInput.value = '';
  appendBubble('user', escHtml(text));
  setDisabled(true);
  const typingRow = appendTyping();

  let aiBubble = null;
  let fullText = '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 300,
        stream: true,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: text }],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    removeTyping();
    aiBubble = appendBubble('ai', '');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          if (json.type === 'content_block_delta' && json.delta?.text) {
            fullText += json.delta.text;
            aiBubble.textContent = fullText;
            chatLog.scrollTop = chatLog.scrollHeight;
          }
        } catch {}
      }
    }

    if (fullText) speak(fullText);

  } catch (err) {
    removeTyping();
    appendBubble('ai', `<span>⚠ COPILOT OFFLINE — ${escHtml(err.message || 'Check connection')}</span>`);
    document.querySelector('#chat-log .bubble:last-child')?.classList.add('error');
  } finally {
    setDisabled(false);
    userInput.focus();
  }
}

sendBtn.addEventListener('click', () => sendMessage());
userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });
quickBtns.forEach(btn => {
  btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
});

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- MIC ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (!SpeechRecognition) {
  micBtn.style.display = 'none';
  // show inline note if voice not supported
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let isRecording = false;

  recognition.onresult = e => {
    const transcript = e.results[0][0].transcript;
    userInput.value = transcript;
    micBtn.classList.remove('recording');
    isRecording = false;
    sendMessage(transcript);
  };

  recognition.onerror = () => {
    micBtn.classList.remove('recording');
    isRecording = false;
    userInput.placeholder = 'Voice input unavailable — type your question';
    setTimeout(() => { userInput.placeholder = 'ASK PROFWORXML...'; }, 3500);
  };

  recognition.onend = () => {
    micBtn.classList.remove('recording');
    isRecording = false;
  };

  micBtn.addEventListener('click', () => {
    if (busy) return;
    if (isRecording) {
      recognition.stop();
    } else {
      isRecording = true;
      micBtn.classList.add('recording');
      recognition.start();
    }
  });
}
</script>
</body>
</html>
